<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llymemg00 bio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animated-background"></div>
    <div class="gta-flash-layer"></div>
    
    <div id="top-section">
        <div class="container">
            <div class="main-content">
            <!-- Profile Card -->
            <div class="card profile-card">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <img
                            class="avatar-image"
                            src="https://api.lanyard.rest/826095966229889055.png"
                            alt="Avatar"
                        >
                        <div class="status-dot status-dot--offline" id="presence-dot" title="Discord: offline"></div>
                    </div>
                    <button class="dnd-button">Do Not Disturb</button>
                </div>
                <div class="profile-info">
                    <h1 class="profile-name">llymemg00</h1>
                    <p class="profile-username">@llymemg00</p>
                    <p class="profile-bio">Пу-пу-пу...</p>
                    <div class="discord-activity" id="discord-activity">
                        Загрузка Discord активности...
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="right-column">
                <!-- Local Time Card -->
                <div class="card time-card">
                    <div class="card-header">LOCAL TIME</div>
                    <div class="card-content">
                        <div class="time-display" id="time">11:26</div>
                        <div class="location">Kyiv, UA</div>
                    </div>
                </div>

                <!-- Weather Card -->
                <div class="card weather-card">
                    <div class="card-header">WEATHER</div>
                    <div class="card-content">
                        <div class="temperature" id="weather-temp">--°</div>
                        <div class="weather-condition" id="weather-cond">Loading...</div>
                        <div class="weather-location" id="weather-loc">Odesa region, UA</div>
                    </div>
                </div>

                <!-- Connections Card -->
                <div class="card connections-card">
                    <div class="card-header">CONNECTIONS</div>
                    <div class="connections-grid">
                        <a href="https://open.spotify.com/user/31qrbyxsiawhh36e76utmioj4wq4" target="_blank" rel="noopener noreferrer" class="connection-icon" id="spotify-icon">
                            <!-- Spotify (оригинальная форма, обесцвечивается через CSS filter) -->
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <!-- круг чуть больше, ближе к краям -->
                                <circle cx="12" cy="12" r="11" fill="#1DB954"></circle>
                                <!-- 3 фирменные дуги, толще и с большим расстоянием между ними -->
                                <path
                                    d="M7 8.6c2.9-.8 6.9-.6 9.6.8"
                                    stroke="#ffffff"
                                    stroke-width="2.2"
                                    stroke-linecap="round"
                                    fill="none"
                                ></path>
                                <path
                                    d="M7.4 11.2c2.5-.7 5.8-.4 8 .7"
                                    stroke="#ffffff"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    fill="none"
                                ></path>
                                <path
                                    d="M8 13.8c2.1-.6 4.3-.3 6.1.6"
                                    stroke="#ffffff"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    fill="none"
                                ></path>
                            </svg>
                        </a>
                        <a href="https://t.me/llymemg00" target="_blank" rel="noopener noreferrer" class="connection-icon">
                            <!-- Telegram -->
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M21 4L3.8 11.1c-.7.3-.7 1.2.1 1.4L8 13.7l1.9 4.3c.3.7 1.2.7 1.5 0l1.4-3.1 4.2 3.1c.6.4 1.4.1 1.6-.6L22 5.2C22.2 4.5 21.6 3.8 21 4z" fill="#229ED9"/>
                                <path d="M9 13.2l7.5-4.7-5.8 5.4L9 13.2z" fill="#ffffff" opacity="0.9"/>
                            </svg>
                        </a>
                        <a href="https://github.com/llymemg00" target="_blank" rel="noopener noreferrer" class="connection-icon">
                            <!-- GitHub -->
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1-1-1.3-1-1.3-.8-.6.1-.6.1-.6.9.1 1.3 1 1.3 1 .8 1.3 2.1.9 2.6.7.1-.6.3-.9.5-1.1-2.2-.2-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.2-.4-1.2.1-2.4 0 0 .8-.3 2.8 1a9.3 9.3 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .6 1.2.2 2.2.1 2.4.7.7 1 1.6 1 2.7 0 3.8-2.3 4.7-4.5 4.9.3.3.5.8.5 1.5v2.3c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/>
                            </svg>
                        </a>
                        <a href="https://osu.ppy.sh/users/32861412" target="_blank" rel="noopener noreferrer" class="connection-icon">
                            <!-- osu! -->
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" fill="#FF66AA"/>
                                <circle cx="12" cy="12" r="8" stroke="#ffffff" stroke-width="1.4"/>
                                <text x="12" y="13.5" text-anchor="middle" font-size="5" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">osu</text>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>

            <!-- Action Button -->
            <div class="action-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <rect x="7" y="7" width="10" height="10" rx="1" ry="1"></rect>
                </svg>
            </div>
        </div>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section" id="bottom-section">
        <div class="container">
            <div class="bottom-content">
                <h2 class="bottom-title" id="minesweeper-title">Сапёр</h2>
                <div class="minesweeper-levels" id="minesweeper-levels" aria-hidden="true">
                    <button type="button" class="minesweeper-level" data-level="medium" aria-label="Средний уровень">
                        <span class="minesweeper-level-mark"></span>
                    </button>
                    <button type="button" class="minesweeper-level" data-level="hard" aria-label="Сложный уровень">
                        <span class="minesweeper-level-mark"></span>
                        <span class="minesweeper-level-mark"></span>
                    </button>
                </div>
                <div class="minesweeper" id="minesweeper">
                    <div class="minesweeper-toolbar">
                        <div class="minesweeper-stat">
                            <span class="minesweeper-stat-label">Мины</span>
                            <span class="minesweeper-stat-value" id="mine-count">25</span>
                        </div>
                        <button type="button" class="minesweeper-face" id="minesweeper-reset" title="Новая игра" data-state="idle">
                            <svg class="minesweeper-face-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <g class="minesweeper-face-icon-idle">
                                    <polyline points="23 4 23 10 17 10"></polyline>
                                    <polyline points="1 20 1 14 7 14"></polyline>
                                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"></path>
                                    <path d="M3.51 15A9 9 0 0 0 18.36 18.36L23 14"></path>
                                </g>
                                <g class="minesweeper-face-icon-won">
                                    <circle cx="12" cy="12" r="9"></circle>
                                    <polyline points="8 12 11 15 16 9"></polyline>
                                </g>
                                <g class="minesweeper-face-icon-lost">
                                    <circle cx="12" cy="12" r="9"></circle>
                                    <line x1="9" y1="9" x2="15" y2="15"></line>
                                    <line x1="15" y1="9" x2="9" y2="15"></line>
                                </g>
                            </svg>
                        </button>
                        <div class="minesweeper-stat">
                            <span class="minesweeper-stat-label">Время</span>
                            <span class="minesweeper-stat-value" id="mine-timer">0</span>
                        </div>
                    </div>
                    <div class="minesweeper-controls">
                        <button type="button" class="minesweeper-flag-toggle" id="minesweeper-flag-mode" aria-pressed="false">
                            Флаг: выкл
                        </button>
                        <span class="minesweeper-hint">ПКМ — флаг · на телефоне включите режим «Флаг»</span>
                    </div>
                    <div class="minesweeper-board" id="minesweeper-board" role="grid" aria-label="Поле сапёра"></div>
                    <p class="minesweeper-status" id="minesweeper-status" aria-live="polite"></p>
                </div>
            </div>
        </div>
        <!-- Action Button (Bottom) -->
        <div class="action-button action-button-bottom">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <rect x="7" y="7" width="10" height="10" rx="1" ry="1"></rect>
            </svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
